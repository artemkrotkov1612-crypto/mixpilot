[project]
name = "mixpilot-worker"
version = "0.1.0"
description = "MixPilot local audio/AI worker (FastAPI on 127.0.0.1)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mixpilot_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
