[project]
name = "mixpilot-worker"
version = "0.1.0"
description = "MixPilot local audio/AI worker (FastAPI on 127.0.0.1)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=1.26",
    # M2: анализ и стемы
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "demucs>=4.0.1",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    # M3: сведение/мастеринг
    "scipy>=1.11",
    "pyloudnorm>=0.1.1",
    "numba>=0.60",  # njit для горячих DSP-циклов (транзитивно из librosa, фиксируем явно)
    # M4: понимание свободного текста (только текст, аудио не покидает компьютер)
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
]

# Кап demucs (torch/torchaudio <2.2) устарел: с 2.5 работает (проверено GPU-e2e).
# До 2.6 не поднимаем: там weights_only=True по умолчанию ломает загрузку весов demucs.
[tool.uv]
override-dependencies = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
]

# PyTorch с CUDA 12.4 (RTX 3070): дефолтный PyPI на Windows отдаёт CPU-сборку.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
# Стабильный 4.0.1 не содержит demucs.api (callback/отмена появились в 4.1.0a);
# uv.lock пинит конкретный коммит. Для установщика (M8) соберём wheel заранее.
demucs = { git = "https://github.com/adefossez/demucs" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mixpilot_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Страховка от зависаний (например, блокирующий ws.receive_json): падение вместо вечного ожидания.
timeout = 120
